name: NovaOS 1.0 Beta QPR1 GSI Build (SM-X130)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Disk Alanini Temizle ve Hazirla
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/aws-cli /usr/local/julia* /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          sudo mkdir -p /mnt/NovaOS/tmp /mnt/NovaOS/src
          sudo chown -R $USER:$USER /mnt/NovaOS
          df -h

      - name: AOSP Derleme Ortamini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 bc ccache repo xz-utils

      - name: TrebleDroid GSI Kaynaklarini Cek
        run: |
          export TMPDIR=/mnt/NovaOS/tmp
          cd /mnt/NovaOS/src
          git config --global user.name "omerhasanceylan-netizen"
          git config --global user.email "omerhasanceylan@gmail.com"
          repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-21.0
          git clone https://github.com/TrebleDroid/treble_manifest.git -b android-14.0 .repo/local_manifests && sed -i 's/"github"/"github-td"/g' .repo/local_manifests/*.xml && sed -i "/remove-project/d" .repo/local_manifests/*.xml && python3 -c 'import glob,xml.etree.ElementTree as ET;m=ET.parse(".repo/manifest.xml").getroot();ps={p.get("path")refs for p in m.findall("project")});for f in glob.glob(".repo/local_manifests/*.xml"):t=ET.parse(f);r=t.getroot();[r.remove(p) for p in list(r.findall("project")) if p.get("path") in ps];t.write(f)'
          repo sync -c -j$(bproc --all 2>/dev/null || nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          rm -rf .repo/projects/*/.git/objects/pack/*.tmp
          (cd device/phh/treble && bash generate.sh)

      - name: Galaxy Tab A11 (arm64-ab) GSI Imaji Derle
        run: |
          export TMPDIR=/mnt/NovaOS/tmp
          cd /mnt/NovaOS/src
          source build/envsetup.sh
          lunch treble_arm64_bvN-userdebug
          make systemimage -j$(nproc --all)
          xz -c -T0 -6 out/target/product/tdgsi_arm64_ab/system.img > out/target/product/tdgsi_arm64_ab/NovaOS-1.0-Beta-QPR1-arm64-ab-SM-X130.img.xz

      - name: GSI Imajini GitHub Release Olarak Yukle
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0-gsi-${{ github.run_number }}
          name: NovaOS 1.0 Beta QPR1 GRsI SM-X130 (#${{ github.run_number }})
          files: /mnt/NovaOS/src/out/target/product/tdgsi_arm64_ab/*.img.xz
          draft: false
          prerelease: true
