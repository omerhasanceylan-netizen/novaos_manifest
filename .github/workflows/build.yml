name: NovaOS 1.1 Beta (Potato Fries) Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Disk Alanini Temizle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: AOSP Derleme Ortamini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 bc ccache repo

      - name: NovaOS Kaynaklarini ve Manifesti Cek
        run: |
          mkdir -p ~/NovaOS && cd ~/NovaOS
          git config --global user.name "omerhasanceylan-netizen"
          git config --global user.email "omerhasanceylan@gmail.com"
          repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/novaos_garden.xml .repo/local_manifests/
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: NovaOS 1.1 Beta (Potato Fries) Derle
        run: |
          cd ~/NovaOS
          source build/envsetup.sh
          lunch novaos_garden-userdebug
          mka bacon -j$(nproc --all)
